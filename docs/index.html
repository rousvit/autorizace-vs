<!doctype html>
<html lang="cs">
<head>

  <meta name="description" content="Neoficiální trenažér k písemné části autorizační zkoušky ČKAIT – obor Stavby vodního hospodářství a krajinného inženýrství.">
  <meta name="theme-color" content="#0a66c2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e141b" media="(prefers-color-scheme: dark)">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
  <script>
    // motiv nastavit ještě před vykreslením, ať stránka neprobliká
    try {
      var t = JSON.parse(localStorage.getItem('avs.v1') || '{}').settings;
      if (t && (t.theme === 'light' || t.theme === 'dark')) document.documentElement.dataset.theme = t.theme;
    } catch (e) {}
  </script>

<body>
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="back-btn" aria-label="Zpět" hidden>
